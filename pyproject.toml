[project]
name = "langchain-academy"
version = "0.1.0"
description = "LangChain Academy — Introduction to LangGraph, refactored to run fully locally."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph",
    "langgraph-prebuilt",
    "langgraph-sdk",
    "langgraph-checkpoint-sqlite",
    "langgraph-cli[inmem]",
    "langsmith>=0.7.31",
    "langchain-community",
    "langchain-core>=1.2.28",
    "langchain-openai>=1.1.14",
    "langchain-text-splitters>=1.1.2",
    "langchain-tavily",
    "wikipedia",
    "trustcall",
    "python-dotenv",
    "jupyterlab",
    "aiohttp>=3.13.4",
    "Pygments>=2.20.0",
    "cryptography>=46.0.7",
]

[project.optional-dependencies]
# Apple Silicon only: local serving via `uv run mlx_lm.server` (README "Option C").
mlx = ["mlx-lm; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lc_local"]
